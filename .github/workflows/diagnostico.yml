name: Diagnostico CONFAZ (temporario)
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.confaz.fazenda.gov.br/legislacao/convenios/2018/CV142_18 https://www.confaz.fazenda.gov.br/ http://www.confaz.fazenda.gov.br/; do
            echo "== $u"; curl -sS -o /dev/null -w "%{http_code} %{time_total}s ip=%{remote_ip}\n" -A "Mozilla/5.0" --max-time 90 "$u" || echo "falhou"
          done
          getent hosts www.confaz.fazenda.gov.br || true
          curl -sS -m 10 https://ipinfo.io/country || true
